<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們的問題 - 專用擲骰機</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes roll3d {
      0% { transform: rotateX(0deg) rotateY(0deg) scale(0.8); opacity: 0.5; }
      50% { transform: rotateX(360deg) rotateY(180deg) scale(1.15); opacity: 0.9; }
      100% { transform: rotateX(720deg) rotateY(360deg) scale(1); opacity: 1; }
    }
    .animate-roll { animation: roll3d 0.5s ease-out; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-5">
    
    <!-- 標題區 -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold tracking-wide text-amber-400">🎲 《我們的問題》擲骰機</h1>
      <p class="text-xs text-slate-400">專用動態追擲與規則判定系統</p>
    </div>

    <!-- 參數設定面板 (數量 & 加成) -->
    <div class="grid grid-cols-2 gap-3 bg-slate-900/80 border border-slate-700/60 rounded-xl p-3">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">擲骰數量</label>
        <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg overflow-hidden">
          <button onclick="adjustCount(-1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold">-</button>
          <input id="dice-count" type="number" min="1" max="20" value="1" class="w-full bg-transparent text-center text-xs font-bold text-amber-300 focus:outline-none" />
          <button onclick="adjustCount(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold">+</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">基礎加值 (Boost)</label>
        <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg overflow-hidden">
          <button onclick="adjustBoost(-1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold">-</button>
          <input id="base-boost" type="number" value="0" class="w-full bg-transparent text-center text-xs font-bold text-emerald-400 focus:outline-none" />
          <button onclick="adjustBoost(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold">+</button>
        </div>
      </div>
    </div>

    <!-- 主要顯示區 -->
    <div class="bg-slate-950/80 border border-slate-700/60 rounded-xl p-4 text-center flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden">
      <div id="dice-container" class="w-full transition-all duration-300">
        <div id="dice-value" class="text-6xl font-black tracking-tight text-amber-300">--</div>
        <div id="sub-result" class="text-sm font-medium text-slate-400 mt-2 min-h-[24px]">點擊上方按鈕開始擲骰</div>
      </div>
      <div id="multi-results-list" class="w-full space-y-1.5 hidden max-h-44 overflow-y-auto pr-1"></div>
      <div id="outcome-badge" class="mt-3 hidden px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase"></div>
    </div>

    <!-- 擲骰控制按鈕區 -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="executeRoll('1d10')" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition-all flex flex-col items-center justify-center border border-indigo-400/30">
        <span class="text-lg">擲 1d10</span>
        <span class="text-[10px] text-indigo-200">10 ➔ 自動加擲 1d2</span>
      </button>

      <button onclick="executeRoll('1d100')" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg transition-all flex flex-col items-center justify-center border border-emerald-400/30">
        <span class="text-lg">擲 1d100</span>
        <span class="text-[10px] text-emerald-200">5 (DF) / 95 (CS)</span>
      </button>
    </div>

    <!-- 其他通用骰子 -->
    <div class="flex justify-between gap-2 pt-2 border-t border-slate-700/50">
      <button onclick="executeRoll('d4')" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d4</button>
      <button onclick="executeRoll('d6')" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d6</button>
      <button onclick="executeRoll('d8')" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d8</button>
      <button onclick="executeRoll('d12')" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d12</button>
      <button onclick="executeRoll('d20')" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d20</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span>擲骰歷史紀錄</span>
        <button onclick="clearHistory()" class="text-slate-500 hover:text-slate-300 underline">清除</button>
      </div>
      <div id="history-log" class="bg-slate-950/40 border border-slate-800 rounded-xl p-2 h-32 overflow-y-auto text-xs space-y-1.5 font-mono">
        <div class="text-slate-600 text-center py-4">尚無擲骰紀錄</div>
      </div>
    </div>

  </div>

  <script>
    const countInput = document.getElementById('dice-count');
    const boostInput = document.getElementById('base-boost');
    const diceValueEl = document.getElementById('dice-value');
    const subResultEl = document.getElementById('sub-result');
    const multiResultsList = document.getElementById('multi-results-list');
    const outcomeBadgeEl = document.getElementById('outcome-badge');
    const diceContainer = document.getElementById('dice-container');
    const historyLogEl = document.getElementById('history-log');

    let history = [];

    function adjustCount(delta) {
      let val = parseInt(countInput.value) || 1;
      val = Math.max(1, Math.min(20, val + delta));
      countInput.value = val;
    }

    function adjustBoost(delta) {
      let val = parseInt(boostInput.value) || 0;
      boostInput.value = val + delta;
    }

    function playRollAnimation() {
      diceContainer.classList.remove('animate-roll');
      void diceContainer.offsetWidth; // 強制重繪
      diceContainer.classList.add('animate-roll');
    }

    function setOutcomeBadge(text, colorClass) {
      if (!text) {
        outcomeBadgeEl.classList.add('hidden');
        return;
      }
      outcomeBadgeEl.className = `mt-3 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase border ${colorClass}`;
      outcomeBadgeEl.innerText = text;
      outcomeBadgeEl.classList.remove('hidden');
    }

    function executeRoll(type) {
      playRollAnimation();
      const count = parseInt(countInput.value) || 1;
      const boost = parseInt(boostInput.value) || 0;
      let rollResults = [];
      let totalValue = 0;

      for (let i = 0; i < count; i++) {
        let item = { id: i + 1, type, raw: 0, boost, final: 0, extra: null, tag: null, tagClass: '' };

        if (type === '1d10') {
          item.raw = Math.floor(Math.random() * 10) + 1;
          item.final = item.raw + boost;

          if (item.raw === 10) {
            const d2 = Math.floor(Math.random() * 2) + 1;
            item.extra = d2;
            if (d2 === 1) {
              item.tag = '✨ CS (大成功)';
              item.tagClass = 'bg-emerald-950/80 text-emerald-400 border-emerald-500/50';
            } else {
              item.tag = '💥 CF (大失敗)';
              item.tagClass = 'bg-rose-950/80 text-rose-400 border-rose-500/50';
            }
          }
        } else if (type === '1d100') {
          item.raw = Math.floor(Math.random() * 100) + 1;
          item.final = item.raw + boost;

          if (item.raw === 5) {
            item.tag = '☠️ DF (劇烈失敗)';
            item.tagClass = 'bg-rose-950/80 text-rose-400 border-rose-500/50';
          } else if (item.raw === 95) {
            item.tag = '✨ CS (大成功)';
            item.tagClass = 'bg-emerald-950/80 text-emerald-400 border-emerald-500/50';
          }
        } else {
          const sides = parseInt(type.replace('d', ''));
          item.raw = Math.floor(Math.random() * sides) + 1;
          item.final = item.raw + boost;
        }

        totalValue += item.final;
        rollResults.push(item);
      }

      // 單顆與多顆的畫面處理
      if (count === 1) {
        multiResultsList.classList.add('hidden');
        diceValueEl.classList.remove('hidden');
        subResultEl.classList.remove('hidden');

        const res = rollResults[0];
        diceValueEl.innerText = res.final;

        let subText = `基礎: ${res.raw}`;
        if (boost !== 0) subText += ` (${boost >= 0 ? '+' : ''}${boost})`;

        if (res.type === '1d10' && res.raw === 10) {
          subResultEl.innerHTML = `<span class="text-amber-400 font-bold">1d10=10</span> ➔ 追擲 1d2 = <span class="font-bold ${res.extra === 1 ? 'text-emerald-400' : 'text-rose-400'}">${res.extra}</span> ${boost !== 0 ? `| 加值:${boost}` : ''}`;
        } else {
          subResultEl.innerText = subText;
        }

        if (res.tag) {
          setOutcomeBadge(res.tag, res.tagClass);
        } else {
          setOutcomeBadge(null);
        }

      } else {
        // 多顆模式
        diceValueEl.classList.add('hidden');
        subResultEl.classList.add('hidden');
        setOutcomeBadge(null);
        multiResultsList.classList.remove('hidden');

        multiResultsList.innerHTML = rollResults.map(r => `
          <div class="flex items-center justify-between bg-slate-900 border border-slate-700/60 rounded-lg px-3 py-1.5 text-xs">
            <span class="text-slate-400 font-mono">#${r.id}</span>
            <span class="font-bold text-amber-300 text-sm">${r.final} <span class="text-[10px] text-slate-500 font-normal">(原始:${r.raw})</span></span>
            ${r.extra !== null ? `<span class="text-slate-300 text-[11px]">1d2=${r.extra}</span>` : ''}
            ${r.tag ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${r.tagClass}">${r.tag}</span>` : '<span class="text-slate-500">-</span>'}
          </div>
        `).join('');
      }

      // 歷史紀錄處理
      const boostText = boost !== 0 ? ` [Boost ${boost >= 0 ? '+' : ''}${boost}]` : '';
      let logText = `${count}x ${type}${boostText} ➔ `;
      
      if (count === 1) {
        const res = rollResults[0];
        logText += `${res.final}`;
        if (res.extra !== null) logText += ` (1d2=${res.extra})`;
        if (res.tag) logText += ` | ${res.tag}`;
      } else {
        logText += `總和 ${totalValue} (` + rollResults.map(r => r.final + (r.tag ? `:${r.tag.slice(0, 4)}` : '')).join(', ') + `)`;
      }

      addHistory(logText);
    }

    function addHistory(text) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ time: now, text });
      renderHistory();
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyLogEl.innerHTML = `<div class="text-slate-600 text-center py-4">尚無擲骰紀錄</div>`;
        return;
      }
      historyLogEl.innerHTML = history.map(item => `
        <div class="flex justify-between items-center py-1 border-b border-slate-800/60 last:border-0">
          <span class="text-slate-300 truncate pr-2">${item.text}</span>
          <span class="text-[10px] text-slate-500 shrink-0">${item.time}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
