<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們的問題 - 16:9 全螢幕無限連鎖擲骰系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes roll3d {
      0% { transform: rotateX(0deg) rotateY(0deg) scale(0.9); opacity: 0.6; }
      50% { transform: rotateX(360deg) rotateY(180deg) scale(1.08); opacity: 0.95; }
      100% { transform: rotateX(720deg) rotateY(360deg) scale(1); opacity: 1; }
    }
    .animate-roll { animation: roll3d 0.45s ease-out; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans overflow-x-hidden">

  <!-- 16:9 寬螢幕主容器 -->
  <div class="w-full max-w-[1600px] aspect-video bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl flex flex-col p-6 space-y-4 overflow-hidden relative">
    
    <!-- 頂部標題列 -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-3">
        <div class="px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 rounded-xl text-indigo-400 font-black text-sm tracking-wider uppercase">
          TRPG System
        </div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent">
          《我們的問題》全螢幕無限連鎖擲骰系統
        </h1>
      </div>
      <div class="text-xs text-slate-400 font-mono flex items-center gap-4">
        <span>抵銷後自動重擲原始骰</span>
        <span>•</span>
        <span>CS/CF 抵銷回歸提示 (Neutralization)</span>
        <span>•</span>
        <span>Strike 累計 (Combo)</span>
      </div>
    </div>

    <!-- 16:9 雙欄主內容區 -->
    <div class="grid grid-cols-12 gap-6 flex-1 min-h-0">
      
      <!-- 左側：控制與參數設定欄 (Col 4) -->
      <div class="col-span-4 bg-slate-950/60 border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between space-y-4">
        
        <div class="space-y-4">
          <div class="text-xs font-bold text-slate-400 tracking-wider uppercase border-b border-slate-800 pb-2">
            ⚙️ 擲骰參數設定 (Parameters)
          </div>

          <!-- 擲骰數量 -->
          <div class="space-y-1.5">
            <label class="block text-xs font-medium text-slate-300">擲骰數量 (Dice Count)</label>
            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden">
              <button onclick="adjustCount(-1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold active:bg-slate-600 transition">-</button>
              <input id="dice-count" type="number" min="1" max="20" value="1" class="w-full bg-transparent text-center text-sm font-bold text-amber-300 focus:outline-none" />
              <button onclick="adjustCount(1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold active:bg-slate-600 transition">+</button>
            </div>
          </div>

          <!-- 基礎加成 -->
          <div class="space-y-1.5">
            <label class="block text-xs font-medium text-slate-300">基礎加值 (Base Boost)</label>
            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden">
              <button onclick="adjustBoost(-1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold active:bg-slate-600 transition">-</button>
              <input id="base-boost" type="number" value="0" class="w-full bg-transparent text-center text-sm font-bold text-emerald-400 focus:outline-none" />
              <button onclick="adjustBoost(1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold active:bg-slate-600 transition">+</button>
            </div>
          </div>
        </div>

        <!-- 主要控制按鈕 -->
        <div class="space-y-3 pt-2">
          <button onclick="executeRoll('1d10')" class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg border border-indigo-400/30 transition-all flex flex-col items-center justify-center gap-1 group">
            <span class="text-lg tracking-wide">🎲 擲 1d10 連鎖</span>
            <span class="text-[11px] text-indigo-200 opacity-80">10 ➔ 1d2 (1:CS / 2:CF) ➔ 抵銷重擲原始骰</span>
          </button>

          <button onclick="executeRoll('1d100')" class="w-full py-4 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg border border-emerald-400/30 transition-all flex flex-col items-center justify-center gap-1 group">
            <span class="text-lg tracking-wide">🎯 擲 1d100 高級連鎖</span>
            <span class="text-[11px] text-emerald-200 opacity-80">=5 ➔ 1d10 ➔ 1d2 (CS:返1d100 / CF:續1d10 / 抵銷:重擲原始骰)</span>
          </button>
        </div>

        <!-- 通用標準骰子 -->
        <div class="space-y-1.5 pt-2 border-t border-slate-800">
          <span class="text-[11px] font-medium text-slate-500">通用標準骰子</span>
          <div class="grid grid-cols-5 gap-2">
            <button onclick="executeRoll('d4')" class="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">d4</button>
            <button onclick="executeRoll('d6')" class="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">d6</button>
            <button onclick="executeRoll('d8')" class="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">d8</button>
            <button onclick="executeRoll('d12')" class="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">d12</button>
            <button onclick="executeRoll('d20')" class="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">d20</button>
          </div>
        </div>

      </div>

      <!-- 右側：連鎖視覺顯示與歷史記錄欄 (Col 8) -->
      <div class="col-span-8 flex flex-col space-y-4 min-h-0">
        
        <!-- 連鎖追擲動態展示區 -->
        <div class="flex-1 bg-slate-950/80 border border-slate-800 rounded-2xl p-5 flex flex-col relative overflow-hidden shadow-inner min-h-0">
          
          <div class="flex justify-between items-center border-b border-slate-800/80 pb-2 mb-3">
            <span class="text-xs font-bold text-amber-400 tracking-wider uppercase">📊 即時連鎖追擲視覺圖譜 (Live Chain Graph)</span>
            <div id="strike-badges" class="flex gap-2 text-xs font-bold"></div>
          </div>

          <div id="dice-container" class="flex-1 overflow-y-auto space-y-3 pr-2">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-600 space-y-2">
              <div class="text-4xl">🎲</div>
              <div class="text-sm">點擊左側按鈕開始執行連鎖擲骰</div>
            </div>
            <div id="chain-flow-display" class="space-y-3 hidden"></div>
          </div>
        </div>

        <!-- 歷史紀錄區域 -->
        <div class="h-44 bg-slate-950/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col min-h-0 space-y-2">
          <div class="flex justify-between items-center text-xs text-slate-400">
            <span class="font-bold flex items-center gap-1.5">📜 完整擲骰歷史紀錄 (Roll History)</span>
            <button onclick="clearHistory()" class="text-slate-500 hover:text-slate-300 underline">清除紀錄</button>
          </div>
          <div id="history-log" class="flex-1 overflow-y-auto text-xs space-y-1.5 font-mono pr-1">
            <div class="text-slate-600 text-center py-4">尚無歷史紀錄</div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const countInput = document.getElementById('dice-count');
    const boostInput = document.getElementById('base-boost');
    const emptyState = document.getElementById('empty-state');
    const chainFlowDisplay = document.getElementById('chain-flow-display');
    const strikeBadges = document.getElementById('strike-badges');
    const diceContainer = document.getElementById('dice-container');
    const historyLog = document.getElementById('history-log');

    let history = [];

    function adjustCount(delta) {
      let val = parseInt(countInput.value) || 1;
      val = Math.max(1, Math.min(20, val + delta));
      countInput.value = val;
    }

    function adjustBoost(delta) {
      let val = parseInt(boostInput.value) || 0;
      boostInput.value = val + delta;
    }

    function playAnimation() {
      diceContainer.classList.remove('animate-roll');
      void diceContainer.offsetWidth;
      diceContainer.classList.add('animate-roll');
    }

    // 核心連鎖引擎 (包含抵銷後重擲原始骰邏輯)
    function rollChainEngine(startType, boost) {
      let steps = [];
      let currentMode = startType;
      let continueLoop = true;
      let lastOutcome = null; // 'CS' 或 'CF'
      let csStrike = 0;
      let cfStrike = 0;
      let returnedToList = false;
      let loopSafety = 0;

      while (continueLoop && loopSafety < 50) {
        loopSafety++;

        if (currentMode === '1d100') {
          const raw100 = Math.floor(Math.random() * 100) + 1;
          const final100 = raw100 + boost;
          let step = { type: '1d100', raw: raw100, final: final100, extraD2: null, outcome: null, msg: '', returnNotice: false };

          if (raw100 === 5) {
            step.outcome = 'DF-Trigger';
            step.msg = '🎲 1d100 = 5 觸發追擲 1d10！';
            steps.push(step);
            currentMode = '1d10';
          } else if (raw100 >= 95) {
            const currentOutcome = 'CS';
            // 檢查是否與上次抵銷
            if (lastOutcome && lastOutcome !== currentOutcome) {
              step.returnNotice = true;
              returnedToList = true;
              step.msg = `⚠️ 1d100 = ${raw100} (CS) 與前次 ${lastOutcome} 相互抵銷！請回歸原本列表 (Return to original list)`;
              csStrike = 0;
              cfStrike = 0;
              lastOutcome = null;
              currentMode = startType; // 重新擲原始骰！
              steps.push(step);
              continueLoop = true;
            } else {
              step.outcome = 'CS';
              csStrike++;
              lastOutcome = 'CS';
              step.msg = `✨ 1d100 = ${raw100} (>=95 大成功)`;
              steps.push(step);
              continueLoop = false;
            }
          } else {
            step.msg = `1d100 普通結果: ${raw100}`;
            steps.push(step);
            continueLoop = false;
          }

        } else if (currentMode === '1d10') {
          const raw10 = Math.floor(Math.random() * 10) + 1;
          const final10 = raw10 + boost;
          let step = { type: '1d10', raw: raw10, final: final10, extraD2: null, outcome: null, msg: '', returnNotice: false };

          if (raw10 === 10) {
            const d2 = Math.floor(Math.random() * 2) + 1;
            step.extraD2 = d2;
            const currentOutcome = (d2 === 1) ? 'CS' : 'CF';

            // 檢查 CS/CF 相互抵銷
            if (lastOutcome && lastOutcome !== currentOutcome) {
              step.returnNotice = true;
              returnedToList = true;
              step.outcome = currentOutcome;
              step.msg = `⚠️ 1d10=10 (1d2=${d2}:${currentOutcome}) 觸發 CS/CF 相互抵銷！請回歸原本列表 (Return to original list)`;
              csStrike = 0;
              cfStrike = 0;
              lastOutcome = null;
              currentMode = startType; // 重新擲原始骰！
              steps.push(step);
              continueLoop = true; // 繼續迴圈以進行原始骰重擲！
            } else {
              step.outcome = currentOutcome;
              if (currentOutcome === 'CS') {
                csStrike++;
                step.msg = `✨ 1d10=10 ➔ 1d2=1 (CS)！返回 1d100 重新擲骰！`;
                currentMode = '1d100';
              } else {
                cfStrike++;
                step.msg = `💥 1d10=10 ➔ 1d2=2 (CF)！繼續追擲下一次 1d10！`;
                currentMode = '1d10';
              }
              lastOutcome = currentOutcome;
              steps.push(step);
              continueLoop = true;
            }
          } else {
            step.msg = `1d10 普通結果 ➔ 原始: ${raw10}`;
            steps.push(step);
            continueLoop = false;
          }
        } else {
          // 通用標準骰子 (d4, d6, d8, d12, d20)
          const sides = parseInt(startType.replace('d', ''));
          const raw = Math.floor(Math.random() * sides) + 1;
          const final = raw + boost;
          steps.push({ type: startType, raw, final, extraD2: null, outcome: null, msg: `擲出 ${startType} ➔ 原始: ${raw}`, returnNotice: false });
          continueLoop = false;
        }
      }

      return { steps, csStrike, cfStrike, returnedToList };
    }

    function executeRoll(type) {
      playAnimation();
      const count = parseInt(countInput.value) || 1;
      const boost = parseInt(boostInput.value) || 0;

      emptyState.classList.add('hidden');
      chainFlowDisplay.classList.remove('hidden');

      let allRuns = [];
      let totalCS = 0, totalCF = 0;

      for (let i = 0; i < count; i++) {
        const run = rollChainEngine(type, boost);
        allRuns.push(run);
        totalCS += run.csStrike;
        totalCF += run.cfStrike;
      }

      // 更新 Strike 標籤
      let strikeHtml = '';
      if (totalCS > 0) strikeHtml += `<span class="px-3 py-1 bg-emerald-950 border border-emerald-500/60 text-emerald-400 rounded-full">✨ CS Strike x${totalCS}</span>`;
      if (totalCF > 0) strikeHtml += `<span class="px-3 py-1 bg-rose-950 border border-rose-500/60 text-rose-400 rounded-full">💥 CF Strike x${totalCF}</span>`;
      strikeBadges.innerHTML = strikeHtml;

      // 渲染連鎖流程圖譜
      let flowHtml = '';
      allRuns.forEach((run, idx) => {
        if (count > 1) {
          flowHtml += `<div class="font-bold text-amber-400 text-xs border-l-2 border-amber-400 pl-2 mt-2"># 第 ${idx + 1} 組連鎖測試：</div>`;
        }

        run.steps.forEach((s, sIdx) => {
          let stepBg = 'bg-slate-900 border-slate-800';
          let tagColor = 'text-slate-300';

          if (s.outcome === 'CS') {
            stepBg = 'bg-emerald-950/40 border-emerald-500/40';
            tagColor = 'text-emerald-400';
          } else if (s.outcome === 'CF') {
            stepBg = 'bg-rose-950/40 border-rose-500/40';
            tagColor = 'text-rose-400';
          } else if (s.outcome === 'DF-Trigger') {
            stepBg = 'bg-amber-950/40 border-amber-500/40';
            tagColor = 'text-amber-400';
          }

          flowHtml += `
            <div class="${stepBg} border rounded-xl p-3 flex items-center justify-between text-xs transition-all">
              <div class="flex items-center gap-3">
                <span class="px-2 py-0.5 bg-slate-800 text-slate-400 font-mono rounded text-[10px] font-bold">Step ${sIdx + 1} (${s.type})</span>
                <span class="font-bold text-slate-200">${s.msg}</span>
              </div>
              <div class="flex items-center gap-2">
                ${s.extraD2 ? `<span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-amber-300">1d2 = ${s.extraD2}</span>` : ''}
                <span class="text-sm font-black text-amber-400 font-mono">最終: ${s.final}</span>
              </div>
            </div>
          `;

          if (s.returnNotice) {
            flowHtml += `
              <div class="p-2.5 bg-amber-950/90 border border-amber-400 rounded-xl text-amber-300 text-center font-bold text-xs animate-pulse shadow-lg">
                ⚠️ 注意：已觸發 CS/CF 抵銷機制！已重置連擊並重新進行原始骰 (${type}) 擲骰！請返回原本列表 (Return to original list)
              </div>
            `;
          }
        });
      });

      chainFlowDisplay.innerHTML = flowHtml;

      // 歷史紀錄處理
      const boostText = boost !== 0 ? ` (Boost:${boost >= 0 ? '+' : ''}${boost})` : '';
      const summaryText = `${count}x ${type}${boostText} ➔ 完成 ${allRuns.length} 組連鎖 [CS Strike:${totalCS} | CF Strike:${totalCF}]`;
      addHistory(summaryText);
    }

    function addHistory(text) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ time: now, text });
      renderHistory();
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyLog.innerHTML = `<div class="text-slate-600 text-center py-4">尚無歷史紀錄</div>`;
        return;
      }
      historyLog.innerHTML = history.map(item => `
        <div class="flex justify-between items-center py-1 border-b border-slate-800/60 last:border-0">
          <span class="text-slate-300 truncate pr-2">${item.text}</span>
          <span class="text-[10px] text-slate-500 shrink-0">${item.time}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
