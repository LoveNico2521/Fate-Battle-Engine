<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們的問題 - 專用擲骰機</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes roll3d {
      0% { transform: rotateX(0deg) rotateY(0deg) scale(0.8); opacity: 0.5; }
      50% { transform: rotateX(360deg) rotateY(180deg) scale(1.15); opacity: 0.9; }
      100% { transform: rotateX(720deg) rotateY(360deg) scale(1); opacity: 1; }
    }
    .animate-roll { animation: roll3d 0.5s ease-out; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-6">
    
    <!-- 標題區 -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold tracking-wide text-amber-400">🎲 《我們的問題》擲骰機</h1>
      <p class="text-xs text-slate-400">專用動態追擲與規則判定系統</p>
    </div>

    <!-- 主要顯示區 -->
    <div class="bg-slate-950/80 border border-slate-700/60 rounded-xl p-5 text-center flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden">
      <div id="dice-container" class="transition-all duration-300">
        <div id="dice-value" class="text-6xl font-black tracking-tight text-amber-300">--</div>
        <div id="sub-result" class="text-sm font-medium text-slate-400 mt-2 h-6">點擊上方按鈕開始擲骰</div>
      </div>
      <div id="outcome-badge" class="mt-3 hidden px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase"></div>
    </div>

    <!-- 擲骰控制按鈕區 -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="rollD10()" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition-all flex flex-col items-center justify-center border border-indigo-400/30">
        <span class="text-lg">擲 1d10</span>
        <span class="text-[10px] text-indigo-200">10 ➔ 自動加擲 1d2</span>
      </button>

      <button onclick="rollD100()" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg transition-all flex flex-col items-center justify-center border border-emerald-400/30">
        <span class="text-lg">擲 1d100</span>
        <span class="text-[10px] text-emerald-200">5 (DF) / 95 (CS)</span>
      </button>
    </div>

    <!-- 其他通用骰子 -->
    <div class="flex justify-between gap-2 pt-2 border-t border-slate-700/50">
      <button onclick="rollStandard(4)" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d4</button>
      <button onclick="rollStandard(6)" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d6</button>
      <button onclick="rollStandard(8)" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d8</button>
      <button onclick="rollStandard(12)" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d12</button>
      <button onclick="rollStandard(20)" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 font-medium">d20</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span>擲骰歷史紀錄</span>
        <button onclick="clearHistory()" class="text-slate-500 hover:text-slate-300 underline">清除</button>
      </div>
      <div id="history-log" class="bg-slate-950/40 border border-slate-800 rounded-xl p-2 h-32 overflow-y-auto text-xs space-y-1.5 font-mono">
        <div class="text-slate-600 text-center py-4">尚無擲骰紀錄</div>
      </div>
    </div>

  </div>

  <script>
    const diceValueEl = document.getElementById('dice-value');
    const subResultEl = document.getElementById('sub-result');
    const outcomeBadgeEl = document.getElementById('outcome-badge');
    const diceContainer = document.getElementById('dice-container');
    const historyLogEl = document.getElementById('history-log');

    let history = [];

    function playRollAnimation() {
      diceContainer.classList.remove('animate-roll');
      void diceContainer.offsetWidth; // 強制重繪
      diceContainer.classList.add('animate-roll');
    }

    function setOutcomeBadge(text, colorClass) {
      if (!text) {
        outcomeBadgeEl.classList.add('hidden');
        return;
      }
      outcomeBadgeEl.className = `mt-3 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase border ${colorClass}`;
      outcomeBadgeEl.innerText = text;
      outcomeBadgeEl.classList.remove('hidden');
    }

    function rollD10() {
      playRollAnimation();
      const d10 = Math.floor(Math.random() * 10) + 1;
      let logText = `1d10 ➔ ${d10}`;

      if (d10 === 10) {
        const d2 = Math.floor(Math.random() * 2) + 1;
        diceValueEl.innerText = d10;
        
        if (d2 === 1) {
          subResultEl.innerHTML = `<span class="text-amber-400 font-bold">1d10=10</span> ➔ 追擲 1d2 = <span class="text-emerald-400 font-bold">1</span>`;
          setOutcomeBadge('✨ Critical Success (大成功)', 'bg-emerald-950/80 text-emerald-400 border-emerald-500/50');
          logText += ` | 追擲 1d2=1 ➔ 🎉 CS (大成功)`;
        } else {
          subResultEl.innerHTML = `<span class="text-amber-400 font-bold">1d10=10</span> ➔ 追擲 1d2 = <span class="text-rose-400 font-bold">2</span>`;
          setOutcomeBadge('💥 Critical Failure (大失敗)', 'bg-rose-950/80 text-rose-400 border-rose-500/50');
          logText += ` | 追擲 1d2=2 ➔ 💥 CF (大失敗)`;
        }
      } else {
        diceValueEl.innerText = d10;
        subResultEl.innerText = `普通結果: ${d10}`;
        setOutcomeBadge(null);
      }

      addHistory(logText);
    }

    function rollD100() {
      playRollAnimation();
      const d100 = Math.floor(Math.random() * 100) + 1;
      diceValueEl.innerText = d100;
      let logText = `1d100 ➔ ${d100}`;

      if (d100 === 5) {
        subResultEl.innerHTML = `<span class="text-rose-400 font-bold">1d100 = 5</span> (劇烈失敗)`;
        setOutcomeBadge('☠️ Dramatic Failure (劇烈失敗)', 'bg-rose-950/80 text-rose-400 border-rose-500/50');
        logText += ` ➔ ☠️ DF (劇烈失敗)`;
      } else if (d100 === 95) {
        subResultEl.innerHTML = `<span class="text-emerald-400 font-bold">1d100 = 95</span> (大成功)`;
        setOutcomeBadge('✨ Critical Success (大成功)', 'bg-emerald-950/80 text-emerald-400 border-emerald-500/50');
        logText += ` ➔ 🎉 CS (大成功)`;
      } else {
        subResultEl.innerText = `普通結果: ${d100}`;
        setOutcomeBadge(null);
      }

      addHistory(logText);
    }

    function rollStandard(sides) {
      playRollAnimation();
      const val = Math.floor(Math.random() * sides) + 1;
      diceValueEl.innerText = val;
      subResultEl.innerText = `擲出 d${sides}`;
      setOutcomeBadge(null);
      addHistory(`1d${sides} ➔ ${val}`);
    }

    function addHistory(text) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ time: now, text });
      renderHistory();
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyLogEl.innerHTML = `<div class="text-slate-600 text-center py-4">尚無擲骰紀錄</div>`;
        return;
      }
      historyLogEl.innerHTML = history.map(item => `
        <div class="flex justify-between items-center py-1 border-b border-slate-800/60 last:border-0">
          <span class="text-slate-300">${item.text}</span>
          <span class="text-[10px] text-slate-500">${item.time}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
